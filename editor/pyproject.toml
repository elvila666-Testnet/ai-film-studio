[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mictlan-editor"
version = "0.1.0"
description = "Editor de vídeo de escritorio para el flujo Mictlan"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mictlan-editor = "mictlan_editor.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
